[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-service"
version = "0.1.0"
description = "Auth service skeleton for RetailOps-microservices-platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mwp-common==0.1.0",
    "email-validator>=2.0,<3.0",
    "PyJWT>=2.8,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
