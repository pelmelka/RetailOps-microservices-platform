{{- $imageKeys := dict
  "auth-service" "authService"
  "catalog-service" "catalogService"
  "order-service" "orderService"
  "payment-service" "paymentService"
  "document-service" "documentService"
  "notification-service" "notificationService"
-}}
{{- range $component, $service := .Values.backendServices }}
{{- if $service.enabled }}
{{- $image := index $.Values.images (index $imageKeys $component) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $component }}
  labels:
    {{- include "mwp.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      {{- include "mwp.componentSelectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mwp.componentSelectorLabels" (dict "root" $ "component" $component) | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "mwp.image" (dict "root" $ "image" $image) | quote }}
          imagePullPolicy: {{ include "mwp.imagePullPolicy" (dict "root" $ "image" $image) }}
          ports:
            - name: http
              containerPort: {{ $.Values.backend.containerPort }}
          envFrom:
            - configMapRef:
                name: app-config
            {{- if eq $component "notification-service" }}
            - configMapRef:
                name: notification-service-config
            {{- end }}
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: {{ $.Values.backend.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $.Values.backend.livenessPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- include "mwp.backendResources" (dict "root" $ "resources" $service.resources) | nindent 12 }}
          {{- if and (eq $component "document-service") $.Values.documentStorage.enabled }}
          volumeMounts:
            - name: document-storage
              mountPath: {{ $.Values.documentStorage.mountPath }}
          {{- end }}
      {{- if and (eq $component "document-service") $.Values.documentStorage.enabled }}
      volumes:
        - name: document-storage
          persistentVolumeClaim:
            claimName: document-storage
      {{- end }}
{{- end }}
{{- end }}
