apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "mwp.componentLabels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mwp.componentSelectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redis.servicePort }}
      targetPort: redis
