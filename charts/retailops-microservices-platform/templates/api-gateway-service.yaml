apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    {{- include "mwp.componentLabels" (dict "root" . "component" "api-gateway") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mwp.componentSelectorLabels" (dict "root" . "component" "api-gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.servicePort }}
      targetPort: http
