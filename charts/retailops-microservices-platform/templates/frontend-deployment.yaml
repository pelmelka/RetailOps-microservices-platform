apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dashboard
  labels:
    {{- include "mwp.componentLabels" (dict "root" . "component" "frontend-dashboard") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "mwp.componentSelectorLabels" (dict "root" . "component" "frontend-dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mwp.componentSelectorLabels" (dict "root" . "component" "frontend-dashboard") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend-dashboard
          image: {{ include "mwp.image" (dict "root" . "image" .Values.images.frontendDashboard) | quote }}
          imagePullPolicy: {{ include "mwp.imagePullPolicy" (dict "root" . "image" .Values.images.frontendDashboard) }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- include "mwp.backendResources" (dict "root" . "resources" .Values.frontend.resources) | nindent 12 }}
          volumeMounts:
            - name: frontend-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: frontend-nginx-config
          configMap:
            name: frontend-nginx-config
