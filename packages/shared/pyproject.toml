[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mwp-common"
version = "0.1.0"
description = "Shared FastAPI service foundation for RetailOps-microservices-platform backend services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
