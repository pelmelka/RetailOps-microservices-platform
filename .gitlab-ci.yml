stages:
  - validate
  - build
  - deploy_test
  - smoke_test
  - deploy_prod
  - smoke_prod

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

default:
  interruptible: true

.validation_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.main_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

detect_changes:
  stage: validate
  image: alpine:3.21
  extends: .validation_rules
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - sh scripts/gitlab-ci/detect_changed_artifacts.sh
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      dotenv: artifacts/changed.env
    paths:
      - artifacts/changed.env
      - artifacts/changed-files.txt
      - artifacts/changed-services.txt
      - artifacts/helm-set-args.txt

python_compile:
  stage: validate
  image: python:3.13-slim
  extends: .validation_rules
  script:
    - python -m compileall packages/shared services scripts migrations

pytest:
  stage: validate
  image: python:3.13-slim
  extends: .validation_rules
  before_script:
    - python -m pip install --upgrade pip
    - >-
      python -m pip install
      "./packages/shared[test]"
      "./services/api-gateway[test]"
      "./services/auth-service[test]"
      "./services/catalog-service[test]"
      "./services/order-service[test]"
      "./services/payment-service[test]"
      "./services/document-service[test]"
      "./services/notification-service[test]"
      "./services/workflow-service[test]"
  script:
    - mkdir -p artifacts
    - python -m pytest --basetemp=.pytest-tmp-ci --junitxml=artifacts/pytest-junit.xml
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: artifacts/pytest-junit.xml
    paths:
      - artifacts/pytest-junit.xml

frontend_build:
  stage: validate
  image: node:22-alpine
  extends: .validation_rules
  cache:
    key:
      files:
        - services/frontend-dashboard/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd services/frontend-dashboard
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
  script:
    - npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - services/frontend-dashboard/dist/

helm_validate:
  stage: validate
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  extends: .validation_rules
  script:
    - mkdir -p artifacts/helm
    - helm lint charts/retailops-microservices-platform
    - helm template retailops-test charts/retailops-microservices-platform -f charts/retailops-microservices-platform/values.test.yaml --namespace test > artifacts/helm/retailops-test.yaml
    - helm template retailops-prod charts/retailops-microservices-platform -f charts/retailops-microservices-platform/values.prod.yaml --namespace prod > artifacts/helm/retailops-prod.yaml
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/helm/

shell_syntax:
  stage: validate
  image: alpine:3.21
  extends: .validation_rules
  before_script:
    - apk add --no-cache bash
  script:
    - mkdir -p artifacts
    - bash -n scripts/gitlab-ci/*.sh > artifacts/shell-syntax.log 2>&1
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/shell-syntax.log

build_changed_images:
  stage: build
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  extends: .main_rules
  needs:
    - job: detect_changes
      artifacts: true
    - job: python_compile
      artifacts: false
    - job: pytest
      artifacts: false
    - job: frontend_build
      artifacts: false
    - job: helm_validate
      artifacts: false
    - job: shell_syntax
      artifacts: false
  script:
    - sh scripts/gitlab-ci/build_changed_images.sh

.kubernetes_job:
  tags:
    - kubernetes
    - helm
    - kubectl
  before_script:
    - . scripts/gitlab-ci/setup_kubeconfig.sh
    - kubectl version --client
    - helm version

deploy_test:
  stage: deploy_test
  extends:
    - .kubernetes_job
    - .main_rules
  needs:
    - job: detect_changes
      artifacts: true
    - job: build_changed_images
      artifacts: false
  resource_group: retailops-test
  environment:
    name: test
  script:
    - sh scripts/gitlab-ci/deploy_helm.sh test test retailops charts/retailops-microservices-platform/values.test.yaml

smoke_test:
  stage: smoke_test
  extends:
    - .kubernetes_job
    - .main_rules
  needs:
    - job: detect_changes
      artifacts: true
    - job: deploy_test
      artifacts: false
  resource_group: retailops-test
  environment:
    name: test
  script:
    - mkdir -p artifacts
    - |
      status=0
      sh scripts/gitlab-ci/smoke_k8s.sh test > artifacts/smoke-test.log 2>&1 || status=$?
      cat artifacts/smoke-test.log
      exit "$status"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/smoke-test.log

deploy_prod:
  stage: deploy_prod
  extends: .kubernetes_job
  needs:
    - job: detect_changes
      artifacts: true
    - job: smoke_test
      artifacts: false
  resource_group: retailops-prod
  environment:
    name: production
  interruptible: false
  script:
    - sh scripts/gitlab-ci/deploy_helm.sh prod prod retailops charts/retailops-microservices-platform/values.prod.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false

smoke_prod:
  stage: smoke_prod
  extends:
    - .kubernetes_job
    - .main_rules
  needs:
    - job: detect_changes
      artifacts: true
    - job: deploy_prod
      artifacts: false
  resource_group: retailops-prod
  environment:
    name: production
  interruptible: false
  script:
    - mkdir -p artifacts
    - |
      status=0
      sh scripts/gitlab-ci/smoke_k8s.sh prod > artifacts/smoke-prod.log 2>&1 || status=$?
      cat artifacts/smoke-prod.log
      exit "$status"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/smoke-prod.log
